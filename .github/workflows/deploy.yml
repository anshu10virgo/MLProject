name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Generate Deployment Package
      run: zip -r deploy.zip . -x "*.git*"

    - name: Deploy to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: 'StudentPerformance' # Replace with your exact Elastic Beanstalk App Name
        environment_name: 'StudentPerformance-env' # Replace with your exact Beanstalk Environment Name
        version_label: 'deploy-${{ github.sha }}'
        region: 'us-east-1' # Replace with your target AWS region (e.g., us-east-2, us-west-2)
        deployment_package: deploy.zip